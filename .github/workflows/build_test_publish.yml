name: Build, Test, and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build, unit tests, and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build, run unit tests, and check formatting
        run: ./gradlew build spotlessCheck
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  android_device_test:
    name: Android device tests (API 30)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: ./gradlew :lib:connectedDebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: |
            lib/build/reports/androidTests/**
            lib/build/outputs/androidTest-results/**
          if-no-files-found: ignore

  publish:
    name: Publish to Maven Central
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_and_test, android_device_test]
    runs-on: ubuntu-latest
    environment: tiny-compressor-ktx
    concurrency:
      group: maven-central-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate release tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$tag" != "v$version" ]]; then
            echo "Release tag must match the stable VERSION_NAME in gradle.properties." >&2
            exit 1
          fi
          # actions/checkout can replace a tag ref with its peeled commit during checkout.
          # Fetch the remote tag object again before validating its type and target.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          if [[ "$(git cat-file -t "refs/tags/$tag")" != tag ]]; then
            echo "Release tags must be annotated." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$tag^{}")" != "$(git rev-parse HEAD)" ]]; then
            echo "Release tag must point to the checked-out commit." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point to a commit on main." >&2
            exit 1
          fi
          status="$(curl --silent --show-error --location --head --retry 3 --output /dev/null --write-out '%{http_code}' "https://repo.maven.apache.org/maven2/io/github/joelromanpr/tiny-compressor-ktx/$version/tiny-compressor-ktx-$version.pom")"
          if [[ "$status" != 404 ]]; then
            echo "Maven Central returned HTTP $status for this version; expected 404 before publishing." >&2
            exit 1
          fi
      - name: Verify publishing credentials are configured
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required Maven Central or signing secret is missing: $name" >&2
              exit 1
            fi
          done
      - name: Publish and release
        run: ./gradlew :lib:publishAndReleaseToMavenCentral --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
